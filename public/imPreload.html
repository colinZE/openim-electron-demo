<body>
  <div id="app"></div>


  <script>
    if (("caches" in window)) {
      cacheIm()
    }
    async function cacheIm() {
      const key = "openim-wasm-cache";
      const fileName = "./openIM.wasm";
      const n = await caches.open(key);
      const r = await n.match(fileName);

      const e = async (cachedResponse) => {
        const i = await fetch(fileName, {
          method: "HEAD"
        });
        const o = i.headers.get("ETag");
        const s = i.headers.get("Last-Modified");
        return i.ok && (o !== (cachedResponse == null ? void 0 : cachedResponse.headers.get("ETag")) || s !== (cachedResponse == null ? void 0 : cachedResponse.headers.get("Last-Modified")))
      };

      return r && !await e(r) ? r : R_e(fileName, n)
    }
    async function R_e(fileName, cache) {
      const response = await fetch(fileName, {
        cache: "default"
      });
      try {
        await cache.put(fileName, response.clone())
      } catch (error) {
        console.warn("Failed to put cache")
      }
      return response;
    }
  </script>
